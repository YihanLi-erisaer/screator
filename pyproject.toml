[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screator"
version = "1.0.0alpha"
description = "Download a YouTube video you are allowed to reprint, translate with DeepL, and submit to Bilibili."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2026.8.19",
    "deepl==1.32.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
screator = "screator.cli:main"
screator-worker = "screator.desktop_worker:main"

[project.optional-dependencies]
desktop = ["keyring>=25,<26", "qrcode[pil]>=8,<9", "psutil==7.2.2"]
douyin-broker = ["cryptography>=43.0.0"]

[tool.setuptools.packages.find]
include = ["screator*"]

[tool.setuptools.package-data]
"screator.translation" = ["manifest.json"]
